name: Market readiness diagnostic

on:
  push:
    branches: [market-readiness-100926]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint
        shell: bash
        run: |
          set +e
          npm run lint > lint.log 2>&1
          echo $? > lint-exit.txt
          exit 0
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          echo $? > test-exit.txt
          exit 0
      - name: Capture build
        shell: bash
        env:
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
        run: |
          set +e
          npm run build > build.log 2>&1
          echo $? > build-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: market-readiness-diagnostics
          path: |
            lint.log
            lint-exit.txt
            test.log
            test-exit.txt
            build.log
            build-exit.txt
