name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
