name: Apply full-tool performance optimization

on:
  push:
    branches:
      - performance-full-tool-20260916
    paths:
      - .github/workflows/apply-full-tool-performance.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-full-tool-20260916
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Optimize measured PrySight hot paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Target not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Matches: one joined query, narrow payload, continuous timing.
          replace_once(
              'src/app/productmatches/page.tsx',
              "import { formatDate, formatNumber } from '@/lib/format'\n",
              "import { formatDate, formatNumber } from '@/lib/format'\nimport { profileStep } from '@/lib/performance-profile'\n",
          )
          replace_once(
              'src/app/productmatches/page.tsx',
              "  const result = await safeDatabaseQuery(() => prisma.productMatch.findMany({\n    where: { companyId: actor.companyId, matchStatus: 'REVIEW' },\n    include: {\n      product: true,\n      competitorOffer: { include: { competitor: true } },\n    },\n    orderBy: [{ confidenceScore: 'desc' }, { createdAt: 'desc' }],\n  }), [])",
              "  const result = await profileStep('/productmatches', 'review-matches', () => safeDatabaseQuery(() => prisma.productMatch.findMany({\n    relationLoadStrategy: 'join',\n    where: { companyId: actor.companyId, matchStatus: 'REVIEW' },\n    select: {\n      id: true, confidenceScore: true, matchStatus: true, matchEvidence: true, createdAt: true,\n      product: { select: { name: true } },\n      competitorOffer: { select: { competitor: { select: { name: true } } } },\n    },\n    orderBy: [{ confidenceScore: 'desc' }, { createdAt: 'desc' }],\n  }), []), { companyId: actor.companyId }, 250)",
          )

          # Competitors: join nested relations in PostgreSQL, trim history depth, time the complete overview read.
          replace_once(
              'src/app/concurrenten/page.tsx',
              "import { formatDate, formatNumber } from '@/lib/format'\n",
              "import { formatDate, formatNumber } from '@/lib/format'\nimport { profileStep } from '@/lib/performance-profile'\n",
          )
          replace_once(
              'src/app/concurrenten/page.tsx',
              "  const result = await safeDatabaseQuery(async () => {\n",
              "  const result = await profileStep('/concurrenten', 'overview', () => safeDatabaseQuery(async () => {\n",
          )
          replace_once(
              'src/app/concurrenten/page.tsx',
              "      prisma.competitor.findMany({\n        where:",
              "      prisma.competitor.findMany({\n        relationLoadStrategy: 'join',\n        where:",
          )
          replace_once(
              'src/app/concurrenten/page.tsx',
              "              priceHistory: { orderBy: { recordedAt: 'desc' }, take: 2 },",
              "              priceHistory: { orderBy: { recordedAt: 'desc' }, take: 1 },",
          )
          replace_once(
              'src/app/concurrenten/page.tsx',
              "      prisma.companyCountry.findMany({\n        where:",
              "      prisma.companyCountry.findMany({\n        relationLoadStrategy: 'join',\n        where:",
          )
          replace_once(
              'src/app/concurrenten/page.tsx',
              "  }, { competitors: [], countries: [] })\n",
              "  }, { competitors: [], countries: [] }), { companyId: user.companyId }, 300)\n",
          )

          # Feeds: only fetch fields rendered by the overview and profile it.
          replace_once(
              'src/app/feeds/page.tsx',
              "import { formatDate, formatNumber } from '@/lib/format'\n",
              "import { formatDate, formatNumber } from '@/lib/format'\nimport { profileStep } from '@/lib/performance-profile'\n",
          )
          replace_once(
              'src/app/feeds/page.tsx',
              "  const result = await safeDatabaseQuery(() => prisma.feedSource.findMany({ where: { companyId: actor.companyId }, orderBy: { updatedAt: 'desc' }, take: 8 }), [])",
              "  const result = await profileStep('/feeds', 'sources', () => safeDatabaseQuery(() => prisma.feedSource.findMany({\n    where: { companyId: actor.companyId },\n    orderBy: { updatedAt: 'desc' },\n    take: 8,\n    select: { id: true, name: true, isActive: true, lastRunStatus: true, sourceType: true, lastItemCount: true, countryCode: true, format: true, lastRunAt: true },\n  }), []), { companyId: actor.companyId }, 200)",
          )

          # Pricing: remove relation-query fanout and overlap persisted rules with the main product read.
          replace_once(
              'src/lib/pricing-engine.ts',
              "  const products = await prisma.product.findMany({\n    where:",
              "  const [products, persistedRules] = await Promise.all([\n    prisma.product.findMany({\n    relationLoadStrategy: 'join',\n    where:",
          )
          replace_once(
              'src/lib/pricing-engine.ts',
              "    take: Math.min(Math.max(limit, 1), 500),\n  })\n\n  const [guardrailMap, persistedRules] = await Promise.all([\n    getProductPricingGuardrails(companyId, products.map((product) => product.id)),\n    usePersistedRules ? getPersistedPricingRules(companyId) : Promise.resolve([]),\n  ])",
              "    take: Math.min(Math.max(limit, 1), 500),\n  }),\n    usePersistedRules ? getPersistedPricingRules(companyId) : Promise.resolve([]),\n  ])\n\n  const guardrailMap = await getProductPricingGuardrails(companyId, products.map((product) => product.id))",
          )

          # Dashboard: retain report data but stop returning unused columns from failed/stale reads.
          replace_once(
              'src/lib/dashboard.ts',
              "      include: { competitorOffer: { include: { competitor: true, productMatch: { include: { product: true } } } } },\n      orderBy: { checkedAt: 'desc' },",
              "      select: {\n        errorMessage: true, checkedAt: true,\n        competitorOffer: { select: { competitor: { select: { name: true } }, productMatch: { select: { product: { select: { name: true } } } } } },\n      },\n      orderBy: { checkedAt: 'desc' },",
          )
          replace_once(
              'src/lib/dashboard.ts',
              "      include: { competitor: true, productMatch: { include: { product: true } } },\n      orderBy: { lastCheckedAt: 'asc' },",
              "      select: {\n        normalizedPrice: true, lastCheckedAt: true,\n        competitor: { select: { name: true } },\n        productMatch: { select: { product: { select: { name: true } } } },\n      },\n      orderBy: { lastCheckedAt: 'asc' },",
          )
          PY

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Commit verified performance changes and remove temporary workflow
        run: |
          rm .github/workflows/apply-full-tool-performance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize dashboard matches competitors feeds and pricing"
          git push origin HEAD:performance-full-tool-20260916
