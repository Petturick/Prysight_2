# Prysight production deployment configuration
[build]
command = "npm run lint && npm test && npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"
NEXT_DISABLE_NETLIFY_EDGE = "true"

# Keep the generated Next.js server handler close to the Supabase database
# in London. This removes the US to UK roundtrip on every server navigation.
[functions."___netlify-server-handler"]
region = "lhr"

[functions."scheduled-price-check"]
region = "lhr"


# Baseline browser hardening. A nonce based CSP is handled separately because
# Next.js requires inline bootstrap scripts during server rendering.
[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
